<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Premium Orchestrator</title>
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305; /* Deep, premium onyx black */
            color: #FFFFFF; /* Crisp white essential text */
            font-family: 'Playfair Display', serif; /* Sophisticated serif styling */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dual Ambient Premium Lighting (Gold & Blue) */
        .bg-glow-blue {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(0, 102, 204, 0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .bg-glow-gold {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .app-window {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
            background: rgba(10, 10, 12, 0.85);
            border: 1px solid rgba(0, 102, 204, 0.25); /* Striking Blue Accent Border */
            border-radius: 16px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 102, 204, 0.05);
            backdrop-filter: blur(15px);
        }

        .app-logo {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.5rem;
            color: #D4AF37; /* Striking Metallic Gold Accent */
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 4px;
        }

        .app-subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.15rem;
            color: #A0A0A5;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        /* Interactive Mode Selector Segment */
        .selector-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12rem;
            color: #D4AF37; /* Gold Accent Label */
            margin-bottom: 12px;
            font-weight: 600;
            text-align: left;
            padding-left: 2px;
        }

        .segment-control {
            display: flex;
            background: #0D0E12;
            border: 1px solid rgba(0, 102, 204, 0.15);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #8C909A;
            padding: 10px 0;
            font-size: 0.8rem;
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .segment-btn.active {
            background: linear-gradient(135deg, #0066CC 0%, #004499 100%); /* Striking Blue Interactive Element */
            color: #FFFFFF;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        /* Console Terminal Output Interface */
        .terminal-box {
            background: #050608;
            border: 1px solid rgba(212, 175, 55, 0.15); /* Gold Accent Matrix Border */
            border-radius: 8px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            min-height: 56px;
        }

        .code-string {
            font-family: monospace;
            font-size: 0.85rem;
            color: #FFFFFF; /* Crisp White Text */
            letter-spacing: 0.05rem;
            text-align: left;
            word-break: break-all;
        }

        .copy-trigger {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            font-family: 'Playfair Display', serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: #D4AF37; /* Gold Trigger Action */
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            transition: opacity 0.2s, transform 0.2s;
        }

        .copy-trigger:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        .status-message {
            font-size: 0.75rem;
            height: 16px;
            color: #7E828C;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.05rem;
            transition: color 0.3s ease;
        }

        .status-message.success {
            color: #0088FF; /* Vibrant Blue Success State */
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="bg-glow-blue"></div>
    <div class="bg-glow-gold"></div>

    <div class="app-window">
        <div class="app-logo">Astro</div>
        <div class="app-subtitle">Framework Orchestrator</div>

        <div class="selector-label">Choose Deployment Mode</div>
        <div class="segment-control">
            <button class="segment-btn active" onclick="switchMode('latest', this)">Standard</button>
            <button class="segment-btn" onclick="switchMode('ts', this)">TypeScript</button>
            <button class="segment-btn" onclick="switchMode('minimal', this)">Minimal</button>
        </div>

        <div class="terminal-box">
            <span class="code-string" id="commandDisplay">npm create astro@latest</span>
            <button class="copy-trigger" onclick="copyCommand()">Copy</button>
        </div>

        <div class="status-message" id="statusLog">Click copy to clipboard</div>
    </div>

    <script>
        const commands = {
            latest: "npm create astro@latest",
            ts: "npm create astro@latest -- --template typescript",
            minimal: "npm create astro@latest -- --template minimal"
        };

        let currentKey = 'latest';

        function switchMode(mode, element) {
            currentKey = mode;
            document.getElementById('commandDisplay').innerText = commands[mode];
            
            document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            const statusLog = document.getElementById('statusLog');
            statusLog.innerText = "Click copy to clipboard";
            statusLog.classList.remove('success');
        }

        function copyCommand() {
            const commandText = commands[currentKey];
            navigator.clipboard.writeText(commandText).then(() => {
                const statusLog = document.getElementById('statusLog');
                statusLog.innerText = "Command copied successfully";
                statusLog.classList.add('success');
                
                setTimeout(() => {
                    if(statusLog.innerText === "Command copied successfully") {
                        statusLog.innerText = "Click copy to clipboard";
                        statusLog.classList.remove('success');
                    }
                }, 3000);
            }).catch(err => {
                document.getElementById('statusLog').innerText = "Copy failed. Please manually select.";
            });
        }
    </script>
</body>
</html>
