<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Premium Orchestrator — Mono Edition</title>
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0A0A0A; /* Premium Deep Black */
            color: #FFFFFF; /* Crisp White Text */
            font-family: 'Playfair Display', serif; /* Sophisticated Serif Typography */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Premium Gray Shadow Mask */
        .bg-glow-gray {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .app-window {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
            background: rgba(20, 20, 20, 0.85); /* Dark Gray Container background */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle white border opacity */
            border-radius: 16px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
        }

        .app-logo {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.5rem;
            color: #FFFFFF; /* White Core Entity */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            margin-bottom: 4px;
        }

        .app-subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.15rem;
            color: #707070; /* Muted Slate Gray */
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        /* Interactive Mode Selector Segment */
        .selector-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12rem;
            color: #A0A0A0; /* Medium Gray Label */
            margin-bottom: 12px;
            font-weight: 600;
            text-align: left;
            padding-left: 2px;
        }

        .segment-control {
            display: flex;
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #707070; /* Gray for inactive state */
            padding: 10px 0;
            font-size: 0.8rem;
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .segment-btn.active {
            background: #FFFFFF; /* High-contrast white selector */
            color: #0A0A0A; /* Dark contrast text */
            font-weight: 600;
        }

        /* Console Terminal Output Interface */
        .terminal-box {
            background: #0D0D0D;
            border: 1px solid rgba(255, 255, 255, 0.08); /* Minimal Frame */
            border-radius: 8px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            min-height: 56px;
        }

        .code-string {
            font-family: monospace;
            font-size: 0.85rem;
            color: #E0E0E0; /* Light Gray Output */
            letter-spacing: 0.05rem;
            text-align: left;
            word-break: break-all;
        }

        .copy-trigger {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            font-family: 'Playfair Display', serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: #FFFFFF; /* Solid White Action Button */
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            transition: opacity 0.2s;
        }

        .copy-trigger:hover {
            opacity: 0.6;
        }

        .status-message {
            font-size: 0.75rem;
            height: 16px;
            color: #606060;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.05rem;
            transition: color 0.3s ease;
        }

        .status-message.success {
            color: #FFFFFF; /* Solid White Success Flag */
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="bg-glow-gray"></div>

    <div class="app-window">
        <div class="app-logo">Astro</div>
        <div class="app-subtitle">Framework Orchestrator</div>

        <div class="selector-label">Choose Deployment Mode</div>
        <div class="segment-control">
            <button class="segment-btn active" onclick="switchMode('latest', this)">Standard</button>
            <button class="segment-btn" onclick="switchMode('ts', this)">TypeScript</button>
            <button class="segment-btn" onclick="switchMode('minimal', this)">Minimal</button>
        </div>

        <div class="terminal-box">
            <span class="code-string" id="commandDisplay">npm create astro@latest</span>
            <button class="copy-trigger" onclick="copyCommand()">Copy</button>
        </div>

        <div class="status-message" id="statusLog">Click copy to clipboard</div>
    </div>

    <script>
        const commands = {
            latest: "npm create astro@latest",
            ts: "npm create astro@latest -- --template typescript",
            minimal: "npm create astro@latest -- --template minimal"
        };

        let currentKey = 'latest';

        function switchMode(mode, element) {
            currentKey = mode;
            document.getElementById('commandDisplay').innerText = commands[mode];
            
            document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            const statusLog = document.getElementById('statusLog');
            statusLog.innerText = "Click copy to clipboard";
            statusLog.classList.remove('success');
        }

        function copyCommand() {
            const commandText = commands[currentKey];
            navigator.clipboard.writeText(commandText).then(() => {
                const statusLog = document.getElementById('statusLog');
                statusLog.innerText = "Command copied successfully";
                statusLog.classList.add('success');
                
                setTimeout(() => {
                    if(statusLog.innerText === "Command copied successfully") {
                        statusLog.innerText = "Click copy to clipboard";
                        statusLog.classList.remove('success');
                    }
                }, 3000);
            }).catch(err => {
                document.getElementById('statusLog').innerText = "Copy failed. Please manually select.";
            });
        }
    </script>
</body>
</html>
